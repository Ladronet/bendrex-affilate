name: apply-umami
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-umami
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica la patch revisionata
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/umami-patch.tar.gz "https://litter.catbox.moe/kdzoan.gz"
          tar -xzf /tmp/umami-patch.tar.gz -C /tmp
          echo "e92449c4ec662eff9cfff8fa612f2ae0229fe802b5b3ce2dc2eafd2f0a414835  /tmp/umami.patch" | sha256sum -c -
          git apply --check /tmp/umami.patch
          git apply /tmp/umami.patch
          git diff --stat | tail -3
      - name: Commit e pusj
        run: |
          set -euo pipefail
          git config user.name "Cyber-Architect"
          git config user.email "cyber-architect@bendrex.it"
          git rm -q .github/workflows/apply-umami.yml
          git add -A
          git commit -m "Umami: tracking su 31 pagine, informative privacy/cookie aggiornate" -m "Co-authored-by: OpenBot <335604065+openbotgit[bot]@users.noreply.github.com>"
          git push origin HEAD:main
