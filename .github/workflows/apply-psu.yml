name: apply-psu
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-psu
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica la patch
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/psu.tar.gz "https://n.uguu.se/EZulSfggtWdq.tar.gz"
          tar -xzf /tmp/psu.tar.gz -C /tmp
          echo "ed6a43f602fa5150013624726606ba9bc902d26201b415d222659d15cd39b428  /tmp/psu.patch" | sha256sum -c -
          git apply --check /tmp/psu.patch
          git apply /tmp/psu.patch
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Cyber-Architect"
          git config user.email "cyber-architect@bendrex.it"
          git rm -q .github/workflows/apply-psu.yml
          git add -A
          git commit -m "Alimentatore: nuova guida sui watt e 8 link in entrata" -m "Co-authored-by: OpenBot <335604065+openbotgit[bot]@users.noreply.github.com>"
          git push origin HEAD:main
