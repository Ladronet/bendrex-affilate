name: Import VRAM article

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and extract
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://files.catbox.moe/cb7ui6.gz -o /tmp/site.tar.gz
          tar -xzf /tmp/site.tar.gz -C .
          rm -f .github/workflows/import-vram-images.yml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Bendrex Bot"
          git config user.email "info@bendrex.it"
          git add -A
          git status --porcelain
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Articolo VRAM 8 GB: pagina, link in entrata e sitemap"
          git push origin HEAD:main
